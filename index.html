<!DOCTYPE html>
<html>

<head>
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pix vs The World</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
*{
  user-select:none;
  -webkit-user-select:none;
  -ms-user-select:none;

  -webkit-tap-highlight-color:transparent;
}
    body{
  background:
    radial-gradient(circle at center,#1a1a1a,#050505);

  color:white;

  text-align:center;

  font-family:Arial;

  padding-top:40px;

  overflow-x:hidden;
  
  overflow-y:auto;
}

h1{

  font-size:60px;

  color:#00ffe1;

  text-shadow:
    0 0 10px #00ffe1,
    0 0 20px #00ffe1;

  margin-bottom:10px;

}

#pixState{

  color:#ff2975;

  text-shadow:
    0 0 10px #ff2975;

}

#barContainer{

  width:80%;
  height:40px;

  background:#111;

  margin:20px auto;

  border-radius:20px;

  overflow:hidden;

  border:2px solid #333;

}

#bar{

  height:100%;
  width:50%;

  background:#00ff88;

  transition:0.5s;

  box-shadow:
    0 0 20px #00ff88;

}

#timer{

  margin-top:20px;

  color:#aaa;

}

#pixelContainer{

  display:flex;

  justify-content:center;

  align-items:center;

  margin-top:50px;

}

#pixel{

  width:140px;
  height:140px;

  background:
    linear-gradient(145deg,#ffffff,#cfcfcf);

  border-radius:18px;

  position:relative;

  cursor:pointer;

  transition:
    transform 0.08s,
    box-shadow 0.2s,
    filter 0.2s;

  box-shadow:
    0 0 20px #00ffe1,
    0 0 40px rgba(0,255,225,0.5);

}

/* visage Pix */

#pixel::before,
#pixel::after{

  content:"";

  position:absolute;

  width:14%;
  height:14%;

  background:#111;

  border-radius:50%;

  top:30%;

}

#pixel::before{
  left:26%;
}

#pixel::after{
  right:26%;
}

/* bouche */

#pixel .mouth{

  position:absolute;

  width:32%;
  height:6%;

  background:#111;

  border-radius:20px;

  bottom:24%;

  left:50%;

  transform:translateX(-50%);

}

/* effet hover */

#pixel:hover{

  transform:scale(1.05);

}

/* choc clic */

#pixel.hit{

  transform:scale(0.88);

  filter:brightness(1.4);

}

/* surcharge */

#pixel.overheat{

  animation:glitch 0.15s infinite;

}

/* cooldown */

#pixel.cooldown{

  opacity:0.35;

  transform:scale(0.8);

  filter:grayscale(1);

  cursor:not-allowed;

}

/* animation glitch */

@keyframes glitch{

  0%{
    transform:translate(0px,0px);
  }

  25%{
    transform:translate(-3px,2px);
  }

  50%{
    transform:translate(3px,-2px);
  }

  75%{
    transform:translate(-2px,-2px);
  }

  100%{
    transform:translate(0px,0px);
  }

}

#gameMessage{

  margin-top:30px;

  font-size:40px;

  color:gold;

}
#intro{

  color:#999;

  margin-top:-10px;

  line-height:1.6;

}

#contribution{

  color:#00ffe1;

  margin-top:20px;

  text-shadow:
    0 0 10px #00ffe1;

}
@media(max-width:700px){

  h1{
    font-size:38px;
  }

  #pixel{

    width:100px;
    height:100px;

  }

  #barContainer{
    width:95%;
  }

  body{
    padding:20px;
  }

  #timer{
    font-size:22px;
  }

  #pixel{
  touch-action:manipulation;
}

*{
  user-select:none;
  -webkit-user-select:none;
}

#liveFeed{

  width:90%;

  max-width:500px;

  margin:30px auto;

  padding:15px;

  background:rgba(0,0,0,0.4);

  border:
    1px solid rgba(255,255,255,0.08);

  border-radius:14px;

  min-height:120px;

  text-align:left;

  overflow:hidden;

}

.feedMessage{

  margin:8px 0;

  color:#d5d5d5;

  font-size:14px;

  animation:feedAppear 0.3s ease;

}

@keyframes feedAppear{

  from{

    opacity:0;
    transform:translateY(10px);

  }

  to{

    opacity:1;
    transform:translateY(0px);

  }

}

#pixel.hot{

  box-shadow:
    0 0 35px rgba(255,120,120,0.9),
    0 0 70px rgba(255,0,0,0.5);

}

@keyframes hotPulse{

  from{

    transform:scale(1);

  }

  to{

    transform:scale(1.03);

  }

}

}

  </style>

</head>

<body>

<h1>Pix vs The World</h1>
<p id="intro">
  Le monde a 30 jours pour battre Pix.<br>
  Chaque clic compte.<br>
  Pix évolue. Pix s’adapte. Pix contre-attaque.
</p>

<h2 id="pixState">Pix est calme</h2>

<h2>World : <span id="world">0</span></h2>
<h2>Pix : <span id="pix">0</span></h2>

<h2 id="percent">0%</h2>

<div id="liveFeed"></div>

<h3 id="contribution">
  Votre contribution : 0 clic
</h3>

<div id="barContainer">
  <div id="bar"></div>
</div>

<h2 id="timer">00j 00h 00m 00s</h2>

<div id="pixelContainer">

  <div id="pixel">

    <div class="mouth"></div>

  </div>

</div>

<div id="gameMessage"></div>

<script>

const SUPABASE_URL = "https://tijjbqrjeagbeepfjtbf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRpampicXJqZWFnYmVlcGZqdGJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5OTAwNzQsImV4cCI6MjA5MzU2NjA3NH0.gnkTBKQkxHXdzQikzBRvpIXDJvfWsaHt5BMeB0zJgqw";

const client = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let gameEnded = false;

let lastPixState = "";

let localClicks =
  localStorage.getItem("pix_clicks") || 0;

updateContribution();

if(localClicks === 10){

  addFeedMessage(
    "Vous commencez à résister à Pix."
  );

}

if(localClicks === 100){

  addFeedMessage(
    "Vous avez atteint 100 clics."
  );

}

if(localClicks === 500){

  addFeedMessage(
    "Pix commence à vous remarquer."
  );

}

const feed =
  document.getElementById("liveFeed");

function addFeedMessage(message){

  const div =
    document.createElement("div");

  div.classList.add("feedMessage");

  div.innerText = message;

  feed.prepend(div);

  // max 6 messages

  while(feed.children.length > 6){

    feed.removeChild(feed.lastChild);

  }

}

function updateContribution(){

  document.getElementById("contribution")
    .innerText =
    "Votre contribution : " +
    localClicks +
    " clics";

}

// =========================
// LOAD GAME
// =========================

async function loadGame() {

  const { data } = await client
    .from("global_score")
    .select("*")
    .eq("id",1)
    .single();

  if(!data) return;

  // scores

  let world = data.world_score;
  let pix = data.pix_score;

  document.getElementById("world").innerText = world;
  document.getElementById("pix").innerText = pix;

  // domination

  let total = world + pix;

  if(total > 0){

    let percent =
      Math.floor((world / total) * 100);

    document.getElementById("percent")
      .innerText = percent + "% domination du monde";

    document.getElementById("bar")
      .style.width = percent + "%";

    // couleur barre

    if(percent > 60){
      document.getElementById("bar").style.background = "limegreen";
    }
    else if(percent > 40){
      document.getElementById("bar").style.background = "orange";
    }
    else{
      document.getElementById("bar").style.background = "red";
    }

  }

  // état Pix

 let pixText =
  document.getElementById("pixState").innerText;

 if(lastPixState !== data.pix_state){

  lastPixState = data.pix_state;

  switch(data.pix_state){

    case "calm":

      pixText = "Pix est calme";

      addFeedMessage(
        "Pix observe silencieusement le monde..."
      );

      break;

    case "pressure":

      pixText = "Pix est sous pression";

      addFeedMessage(
        "Pix commence à réagir."
      );

      break;

    case "rage":

      pixText = "Pix est en rage";

      addFeedMessage(
        "Pix entre en rage."
      );

      break;

    case "ultimate":

      pixText = "Pix atteint sa forme ultime";

      addFeedMessage(
        "Pix devient incontrôlable."
      );

      break;

  }

}

  document.getElementById("pixState")
    .innerText = pixText;


  // timer

  updateTimer(data.game_ends_at);

  // victoire / défaite

  if(data.game_status !== "running"){

    gameEnded = true;

    document.getElementById("clickBtn")
      .style.display = "none";

    if(data.game_status === "world_win"){

      document.getElementById("gameMessage")
        .innerText =
        "Pix a été battu… mais il reviendra… plus fort.";

    }
    else{

      document.getElementById("gameMessage")
        .innerText =
        "Vous n’étiez pas prêts.";

    }

  }

}

// =========================
// TIMER
// =========================

function updateTimer(endDate){

  let end =
    new Date(endDate).getTime();

  let now =
    new Date().getTime();

  let distance =
    end - now;

  if(distance < 0){
    distance = 0;
  }

  let days =
    Math.floor(distance / (1000*60*60*24));

  let hours =
    Math.floor((distance % (1000*60*60*24))
    / (1000*60*60));

  let minutes =
    Math.floor((distance % (1000*60*60))
    / (1000*60));

  let seconds =
    Math.floor((distance % (1000*60))
    / 1000);

  document.getElementById("timer")
    .innerText =
    days+"j "+
    hours+"h "+
    minutes+"m "+
    seconds+"s";

}

let heat = 0;

let overheated = false;

const pixel =
  document.getElementById("pixel");

async function clickPixel(){

  if(gameEnded) return;

  // animation choc

  pixel.classList.add("hit");
  
  document.body.style.transform =
  "translateX(2px)";

setTimeout(() => {

  document.body.style.transform =
    "translateX(0px)";

},40);

  setTimeout(() => {
    pixel.classList.remove("hit");
  },80);

  // chauffe

  heat += 3;

  if(heat >= 50){

  document.body.style.transform =
    `translateX(${Math.random()*4-2}px)`;

}
else{

  document.body.style.transform =
    "translateX(0px)";

}

  // glow chaleur

pixel.style.boxShadow =
  `
  0 0 ${20 + heat}px rgba(255,80,80,0.9),
  0 0 ${40 + heat}px rgba(255,0,0,0.4)
  `;

pixel.style.filter =
  `brightness(${1 + heat/120})`;

  // surcharge

  let clickPower = 1;

if(heat >= 70){

  pixel.classList.add("hot");
  pixel.classList.add("overheat");

  clickPower = 0.5;

}
else{

  pixel.classList.remove("overheat");
  pixel.classList.remove("hot");

}

  // backend
  localClicks++;

localStorage.setItem(
  "pix_clicks",
  localClicks
);

updateContribution();

if(Math.random() <= clickPower){

  await client.rpc("increment_world");

}

  loadGame();

}

// refroidissement naturel

setInterval(() => {

if(heat >= 70){

  heat -= 4;

}
else if(heat >= 40){

  heat -= 2;

}
else{

  heat -= 1;

}


  // glow dynamique

if(heat <= 0){

  pixel.style.boxShadow =
    `
    0 0 20px #00ffe1,
    0 0 40px rgba(0,255,225,0.5)
    `;

}
else{

  pixel.style.boxShadow =
    `
    0 0 ${20 + heat}px rgba(255,80,80,0.9),
    0 0 ${40 + heat}px rgba(255,0,0,0.35)
    `;

}
  // luminosité dynamique

  pixel.style.filter =
    `brightness(${1 + heat/120})`;

  // body shake

  if(heat >= 50){

    document.body.style.transform =
      `translateX(${Math.random()*4-2}px)`;

  }
  else{

    document.body.style.transform =
      "translateX(0px)";

  }

  // états visuels

  if(heat >= 70){

    pixel.classList.add("overheat");
    pixel.classList.add("hot");

  }
  else{

    pixel.classList.remove("overheat");
    pixel.classList.remove("hot");

  }

},100);

// event

pixel.addEventListener("click",clickPixel);

// refresh live

setInterval(loadGame,1000);

loadGame();

</script>

</body>
</html>
